# Minimal pacing composition: the real app boot path, the real agent loop, and
# this plugin with no waiting. The driver registers a scripted model adapter, so
# no network and no external CLI runs.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-projections
  name: '@deepseek-ai/dsh-session-projection'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: supervisor-pacing
  name: '@deepseek-ai/dsh-supervisor-pacing'
  config:
    initialDelayMs: 1
    maxDelayMs: 2
    jitterRatio: 0
    bufferMs: 0
    minIntervalMs: 0
