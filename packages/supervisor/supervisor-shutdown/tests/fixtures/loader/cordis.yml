# Minimal shutdown composition: the real app boot path, the real shell seam,
# and this plugin with a one-second countdown. The driver waits for the
# operator command to run and records what the shell seam observed, so no
# machine is ever asked to power off.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-projections
  name: '@deepseek-ai/dsh-session-projection'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: terminals
  name: '@deepseek-ai/dsh-terminal'

- id: subprocess-local
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash-local
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: .

- id: supervisor
  name: '@deepseek-ai/dsh-supervisor-core'
  config:
    workspaceDir: .
    stateDir: ./state
    watchdogEnabled: false

- id: supervisor-tasks
  name: '@deepseek-ai/dsh-supervisor-tasks'

- id: supervisor-ops
  name: '@deepseek-ai/dsh-supervisor-ops'
  config:
    shutdown:
      enabled: true
      command: 'echo fired'
      gracePeriodMin: 1

- id: supervisor-shutdown
  name: '@deepseek-ai/dsh-supervisor-shutdown'
  config:
    enabled: true
    scheduleAfterSeconds: 1
