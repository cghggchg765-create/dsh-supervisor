# The shipped bundle's composition: the real app boot path, the real terminal
# service with a scripted backend the driver registers, the session-projection
# service automatic pacing reads, and all six supervisor rows mounted exactly as
# cordis.patch.yml names them. Automatic pacing registers no tool, so this
# fixture proves it loads and registers its session projection beside the other
# five components; the resume behavior itself is owned by its own loader
# composition. No model and no external CLI runs.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-projections
  name: '@deepseek-ai/dsh-session-projection'

- id: terminals
  name: '@deepseek-ai/dsh-terminal'

- id: subprocess-local
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash-local
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: .

- id: supervisor
  name: '@deepseek-ai/dsh-supervisor-core'
  config:
    workspaceDir: .
    stateDir: ./state
    watchdogEnabled: false

- id: supervisor-tasks
  name: '@deepseek-ai/dsh-supervisor-tasks'

- id: supervisor-orchestration
  name: '@deepseek-ai/dsh-supervisor-orchestration'
  config:
    skillRoots:
      homeDir: ./home
      workspaceDir: ./skills

- id: supervisor-ops
  name: '@deepseek-ai/dsh-supervisor-ops'

- id: supervisor-pacing
  name: '@deepseek-ai/dsh-supervisor-pacing'

- id: supervisor-shutdown
  name: '@deepseek-ai/dsh-supervisor-shutdown'
  config:
    enabled: false
